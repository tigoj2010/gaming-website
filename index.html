
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone</title>
  <style>
    body {
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }
    header {
      background: #1e293b;
      padding: 25px;
    }
    h1 { color: #a78bfa; }
    main { padding: 50px 20px; }
    .card {
      background: #1e293b;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 15px;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h2>🎮 GAMEZONE</h2>
  </header>
  <main>
    <h1>Welkom bij GameZone!</h1>
    <p>Jouw eigen gaming community.</p>

    <div class="card">
      <h2>🔥 Games</h2>
      <p>Ontdek onze favoriete games!</p>
    </div>

    <div class="card">
      <h2>💬 Community</h2>
      <p>Speel samen met andere gamers.</p>
    </div>

    <button onclick="alert('Welkom bij GameZone!')">
      Join de community
    </button>
  </main>
</body>
</html>
